<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#05070c">
<title>OrgaMe – Startbildschirm (Vorschau)</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#05070c}
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#eef1f6;-webkit-font-smoothing:antialiased}
.screen{position:relative;min-height:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column;
  padding:calc(env(safe-area-inset-top) + 18px) 24px calc(env(safe-area-inset-bottom) + 18px);overflow:hidden;
  background:
    radial-gradient(ellipse 70% 38% at 50% 30%,rgba(30,144,255,.30),transparent 70%),
    radial-gradient(ellipse 60% 30% at 85% 75%,rgba(140,60,255,.16),transparent 70%),
    radial-gradient(ellipse 50% 25% at 10% 90%,rgba(255,120,30,.10),transparent 70%),
    linear-gradient(180deg,#070b14 0%,#0a1224 45%,#05070c 100%)}
.screen:after{content:"";position:absolute;right:-60px;bottom:40px;width:340px;height:26px;transform:rotate(-24deg);
  background:linear-gradient(90deg,transparent,#1E90FF 40%,#8a3cff 75%,#ff7a1a);opacity:.55;filter:blur(.4px);pointer-events:none}
.top{display:flex;justify-content:space-between;align-items:center}
.gruenden{display:inline-flex;align-items:center;gap:8px;padding:9px 15px;border-radius:999px;border:1.5px solid rgba(30,144,255,.75);
  color:#7fbaff;text-decoration:none;font-weight:700;font-size:15px;background:rgba(30,144,255,.08)}
.gruenden svg{flex:none}
.logo{text-align:center;margin-top:40px}
.logo img{width:240px;max-width:70%;display:block;margin:0 auto;filter:drop-shadow(0 8px 30px rgba(30,144,255,.35))}
.logo p{margin-top:12px;font-size:17px;color:#d6dcea}
.spacer{flex:1;min-height:40px}
.btn{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;border-radius:18px;padding:16px;font:inherit;font-size:17.5px;font-weight:700;cursor:pointer;border:0;text-decoration:none}
.btn-qr{color:#fff;background:linear-gradient(145deg,#3aa4ff,#1E78F0);box-shadow:0 0 30px rgba(30,144,255,.45),inset 0 1px 0 rgba(255,255,255,.35)}
.or{display:flex;align-items:center;gap:12px;color:#8e98ab;font-size:14.5px;margin:16px 4px}
.or:before,.or:after{content:"";flex:1;height:1px;background:rgba(255,255,255,.18)}
.stack{display:flex;flex-direction:column;gap:12px}
.btn-white{background:#fff;color:#111}
.btn-dark{background:rgba(255,255,255,.05);color:#eef1f6;border:1px solid rgba(255,255,255,.22)}
.soon{position:relative}
.soon:after{content:"bald";position:absolute;right:12px;top:50%;transform:translateY(-50%);font-size:11px;font-weight:700;letter-spacing:.04em;
  text-transform:uppercase;padding:3px 8px;border-radius:999px;background:rgba(30,144,255,.16);color:#3b8cff}
.btn-qr.soon:after{background:rgba(255,255,255,.25);color:#fff}
.btn-dark.soon:after{background:rgba(255,255,255,.12);color:#c9d3ea}
.test{margin-top:16px;display:flex;justify-content:center}
.test a{display:inline-flex;align-items:center;gap:8px;color:#9fc6ff;font-size:14.5px;font-weight:600;text-decoration:none;padding:8px 14px;border-radius:12px;border:1px dashed rgba(127,186,255,.45)}
.legal{margin-top:16px;text-align:center;font-size:12px;color:#7f8aa0;position:relative;z-index:1}
.legal a{color:#9fb3c8}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 24px);transform:translateX(-50%) translateY(20px);opacity:0;
  background:#16213b;border:1px solid rgba(127,186,255,.35);color:#fff;padding:12px 16px;border-radius:14px;font-size:14px;max-width:88%;text-align:center;
  transition:.25s;pointer-events:none;z-index:9}
.toast.show{opacity:1;transform:translateX(-50%)}
.badge{position:fixed;top:calc(env(safe-area-inset-top) + 6px);right:8px;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:#7f8aa0}
</style>
</head>
<body>
<div id="splash" aria-hidden="true" style="position:fixed;inset:0;z-index:2147483000;display:flex;align-items:center;justify-content:center;background:#000;opacity:1;transition:opacity .3s ease">
  <img src="onbac-logo.png" alt="OrgaMe" style="width:min(64vw,320px);height:auto">
</div>
<script>
// Wie in der App: schwarzer Bildschirm mit Vogel und Logo, dann Startbildschirm
setTimeout(function () { document.getElementById('splash').style.opacity = '0'; }, 1700);
setTimeout(function () { var d = document.getElementById('splash'); if (d) d.remove(); }, 2000);
</script>
<div class="screen">
  <div class="top">
    <a class="gruenden" href="https://www.orga.me" target="_blank" rel="noopener">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      Verein gründen
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>
    </a>
  </div>

  <div class="logo">
    <img src="onbac-logo.png" alt="OrgaMe">
    <p>Die All-in-One Vereins-App</p>
  </div>

  <div class="spacer"></div>

  <button class="btn btn-qr soon" data-bald="QR-Code scannen">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M3 7V3h4M17 3h4v4M21 17v4h-4M7 21H3v-4"/><rect x="8" y="8" width="8" height="8" rx="1"/></svg>
    QR-Code scannen
  </button>

  <div class="or">oder anmelden mit</div>

  <div class="stack">
    <button class="btn btn-white soon" data-bald="Mit Apple anmelden">
      <svg width="20" height="22" viewBox="0 0 17 20" fill="#000"><path d="M14.1 10.6c0-2.6 2.1-3.8 2.2-3.9-1.2-1.8-3.1-2-3.7-2-1.6-.2-3.1.9-3.9.9-.8 0-2-.9-3.4-.9C3.6 4.8 2 5.8 1.1 7.3c-1.8 3.2-.5 7.9 1.3 10.5.9 1.3 1.9 2.7 3.2 2.6 1.3-.1 1.8-.8 3.3-.8 1.6 0 2 .8 3.4.8 1.4 0 2.3-1.3 3.1-2.6 1-1.5 1.4-2.9 1.4-3-.1 0-2.7-1-2.7-4.2zM11.6 3c.7-.9 1.2-2 1.1-3.2-1 0-2.2.7-2.9 1.6-.6.7-1.2 1.9-1.1 3.1 1.1.1 2.2-.6 2.9-1.5z"/></svg>
      Mit Apple anmelden
    </button>
    <button class="btn btn-white soon" data-bald="Mit Google anmelden">
      <svg width="20" height="20" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 13 4 4 13 4 24s9 20 20 20 20-9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="m6.3 14.7 6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-7.9l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>
      Mit Google anmelden
    </button>
    <button class="btn btn-dark soon" data-bald="Mit E-Mail anmelden">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>
      Mit E-Mail anmelden
    </button>
  </div>

  <div class="test"><a href="https://onbac.pages.dev/" target="_blank" rel="noopener">🔑 Testzugang (mit Zugangscode)</a></div>

  <p class="legal">Mit der Anmeldung akzeptierst du <a href="agb.html">AGB</a> und <a href="datenschutz.html">Datenschutz</a>.</p>
</div>
<div class="badge">Vorschau</div>
<div class="toast" id="toast"></div>
<script>
const t = document.getElementById('toast'); let tm;
document.querySelectorAll('[data-bald]').forEach(b => b.addEventListener('click', () => {
  t.textContent = '„' + b.dataset.bald + '“ ist vorbereitet, aber in der Testphase noch nicht aktiv. Bitte den Testzugang nutzen.';
  t.classList.add('show'); clearTimeout(tm); tm = setTimeout(() => t.classList.remove('show'), 3200);
}));
</script>
</body>
</html>
